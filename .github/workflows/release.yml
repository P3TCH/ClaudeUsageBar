name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Derive version from tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${tag}' is not of the form vX.Y.Z"
            exit 1
          fi
          {
            echo "TAG=${tag}"
            echo "VERSION=${version}"
          } >> "${GITHUB_ENV}"

      - name: Show toolchain
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Test
        run: swift test

      - name: Build app
        env:
          VERSION: ${{ env.VERSION }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-app.sh

      - name: Verify bundle
        run: |
          set -euo pipefail
          codesign --verify --deep --strict build/UsageBar.app
          built_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/UsageBar.app/Contents/Info.plist)"
          if [[ "${built_version}" != "${VERSION}" ]]; then
            echo "::error::Built CFBundleShortVersionString '${built_version}' does not match tag version '${VERSION}'"
            exit 1
          fi
          echo "Bundle version ${built_version} matches tag"

      - name: Package
        run: |
          set -euo pipefail
          zip_name="UsageBar-${VERSION}-macos-arm64.zip"
          ditto -c -k --keepParent build/UsageBar.app "${zip_name}"
          shasum -a 256 "${zip_name}" > "${zip_name}.sha256"
          cat "${zip_name}.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip_name="UsageBar-${VERSION}-macos-arm64.zip"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          cat > "${notes_file}" <<'EOF'
          ## Install

          Requires macOS 14 or later on Apple Silicon.

          1. Unzip and move `UsageBar.app` to `/Applications`.
          2. This build is ad-hoc signed and not notarized, so macOS Gatekeeper blocks it on first launch. Clear the quarantine flag, then open it:

          ```sh
          xattr -dr com.apple.quarantine /Applications/UsageBar.app
          open /Applications/UsageBar.app
          ```
          EOF
          gh release create "${TAG}" \
            "${zip_name}" \
            "${zip_name}.sha256" \
            --title "UsageBar ${VERSION}" \
            --verify-tag \
            --generate-notes \
            --notes-file "${notes_file}"
